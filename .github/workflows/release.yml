name: Release and Publish

on:
  release:
    types: [published]

jobs:
  release:
    name: Build, Package, Release & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install

      - name: Package Extensions
        run: bash package-extension.sh all

      - name: Find Chrome Extension ZIP
        run: |
          CHROME_ZIP=$(find dist/zips -name "*-chrome.zip" | head -n 1)
          echo "CHROME_ZIP_PATH=$CHROME_ZIP" >> $GITHUB_ENV
          echo "Found Chrome ZIP at: $CHROME_ZIP"

      - name: Upload Assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} dist/zips/*.zip --clobber

      - name: Publish to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v2.2.0
        with:
          file-path: ${{ env.CHROME_ZIP_PATH }}
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: true
