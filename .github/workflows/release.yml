name: Release and Publish

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Version tag of the draft release to build and publish (e.g., v1.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build_and_release:
    name: Build, Package and Release Assets
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Update Codebase Version Locally
        run: |
          TAG_NAME="${{ inputs.tag_name }}"
          VERSION="${TAG_NAME#v}"
          echo "Bumping local files to version: $VERSION"
          npm version "$VERSION" --no-git-tag-version
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('src/manifest.json', 'utf8'));
            manifest.version = '$VERSION';
            fs.writeFileSync('src/manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          "

      - name: Verify
        run: pnpm run verify

      - name: Package Extensions
        run: pnpm run package:all

      - name: Validate ZIP Contents
        run: |
          TAG_NAME="${{ inputs.tag_name }}"
          VERSION="${TAG_NAME#v}"
          node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const version = (process.env.VERSION || '').replace(/^v/, '');
          const zips = fs.readdirSync('dist/zips').filter((name) => name.endsWith('.zip'));
          if (zips.length === 0) throw new Error('No extension ZIPs found.');
          for (const zip of zips) {
            const listing = cp.execFileSync('unzip', ['-l', `dist/zips/${zip}`], { encoding: 'utf8' });
            for (const required of ['manifest.json', 'images/icon-128.png']) {
              if (!listing.includes(required)) throw new Error(`${zip} is missing ${required}`);
            }
            const manifestText = cp.execFileSync('unzip', ['-p', `dist/zips/${zip}`, 'manifest.json'], {
              encoding: 'utf8',
            });
            const manifest = JSON.parse(manifestText);
            if (manifest.version !== version) {
              throw new Error(`${zip} version ${manifest.version} does not match ${version}`);
            }
            if (!manifest.background || !manifest.content_scripts?.length) {
              throw new Error(`${zip} is missing background or content scripts`);
            }
          }
          NODE
        env:
          VERSION: ${{ inputs.tag_name && inputs.tag_name || github.event.release.tag_name }}

      - name: Upload Assets to GitHub Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.tag_name }}" dist/zips/* --clobber

      - name: Publish Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ inputs.tag_name }}" --draft=false

  publish_to_store:
    name: Publish to Chrome Web Store
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Chrome Extension ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist/zips
          gh release download "${{ github.event.release.tag_name }}" --pattern "*-chrome.zip" --dir dist/zips
          CHROME_ZIP=$(find dist/zips -name "*-chrome.zip" | head -n 1)
          echo "CHROME_ZIP_PATH=$CHROME_ZIP" >> $GITHUB_ENV
          echo "Found Chrome ZIP at: $CHROME_ZIP"

      - name: Publish to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v2.2.0
        with:
          file-path: ${{ env.CHROME_ZIP_PATH }}
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: true
